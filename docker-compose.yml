version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financeagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  temporal:
    image: temporalio/auto-setup:1.21.0
    environment:
      - DB=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PWD=postgres
      - DB_NAME=temporal
      - POSTGRES_SEPARATE_DATABASE=true
      - POSTGRES_CREATE_DATABASE=true
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:2.21.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/financeagent
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_NAMESPACE: default
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages/shared/python:/workspace/packages/shared/python
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - temporal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - ./apps/web/.env
    environment:
      API_URL: http://api:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
